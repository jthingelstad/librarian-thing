name: Answer Eval

# Weekly end-to-end answer-quality eval against the PRODUCTION Thingy chat.
# It signs in as EVAL_EMAIL via a real magic-code email (fetched over Fastmail
# JMAP), runs eight archetype questions through /chat, grades the answers with
# Bedrock Haiku, and deletes every conversation it created. It sends a real
# email and burns real rate limit each run - hence weekly, and gated behind
# the ANSWER_EVAL_ENABLED repo variable so it stays off until enabled.
#
# Required configuration (some may not exist yet - create before enabling):
#   vars.ANSWER_EVAL_ENABLED  - set to 'true' to arm the schedule
#   vars.LIBRARIAN_API_URL    - auth/conversations API base (stack output)
#   vars.LIBRARIAN_STREAM_URL - streaming Function URL base (stack output)
#   vars.THINGY_FAST_MODEL    - optional grader model override
#   secrets.FASTMAIL_JMAP_TOKEN - Fastmail JMAP bearer token
#
# Bedrock grading uses the same OIDC deploy role as deploy.yml. Scheduled
# runs execute on main, which the role trust already accepts - do not touch
# the IAM trust policy for this workflow.

on:
  schedule:
    - cron: '23 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  # OIDC credentials for Bedrock Converse (grading) - same role as deploy.yml.
  id-token: write

concurrency:
  group: librarian-answer-eval
  cancel-in-progress: false

jobs:
  eval:
    if: vars.ANSWER_EVAL_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::999153317627:role/WeeklyThingLibrarianDeployOidc
          aws-region: us-east-1

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/librarian/lambda/package-lock.json

      - name: Install Lambda dependencies
        run: npm --prefix apps/librarian/lambda ci

      - name: Run answer eval
        run: npm --prefix apps/librarian/lambda run eval:answers
        env:
          LIBRARIAN_API_URL: ${{ vars.LIBRARIAN_API_URL }}
          LIBRARIAN_STREAM_URL: ${{ vars.LIBRARIAN_STREAM_URL }}
          FASTMAIL_JMAP_TOKEN: ${{ secrets.FASTMAIL_JMAP_TOKEN }}
          THINGY_FAST_MODEL: ${{ vars.THINGY_FAST_MODEL }}
