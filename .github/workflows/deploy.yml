name: Librarian — Corpus & API

# This repo owns the corpus the Librarian API answers from, and the API
# itself. The archive is the library (library.db in S3), not git: every run
# exports it to data/ first. It rebuilds the corpora the library or the code
# has moved past, uploads the embedded artifacts to S3, redeploys the Lambda,
# and hands the topic graph to weekly.thingelstad.com, the one cross-repo
# push left here. Publishing is WT Builder's job.
#
# What starts a build: a push to the pipeline or the API, and the library
# round (library-round.yml, or the Library Agent on the Mac) when its pull
# moved the library past what the corpus was built from. Each corpus records
# the library fingerprint it was built from; `library.py stale` compares.
# From Friday until the issue is sent (Friday and Saturday, US Central)
# nothing automatic changes the corpus: the round still updates the library
# and the build waits, until WT Builder's send names the issue.

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/**'
      - 'librarian-core/**'
      - 'apps/librarian/**'
      - '.github/workflows/deploy.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:
    inputs:
      scope:
        description: 'code: deploy the API. library: build what the library moved past. full: rebuild every corpus.'
        type: choice
        options: [code, library, full]
        default: code
      issue:
        description: 'The issue a send just published (ends the Friday and Saturday hold)'
        type: string
        default: ''
      push_graph:
        description: 'Commit data/librarian/graph.json to the website repo'
        type: boolean
        default: false

permissions:
  contents: read
  # OIDC deploy credentials - the job assumes WeeklyThingLibrarianDeployOidc
  # instead of using static access keys.
  id-token: write

concurrency:
  group: librarian-production
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::999153317627:role/WeeklyThingLibrarianDeployOidc
          role-session-name: librarian-${{ github.run_id }}
          allowed-account-ids: '999153317627'
          aws-region: us-east-1

      # Pinned to a commit: this job holds OIDC deploy credentials and a PAT
      # that writes to weekly.thingelstad.com.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          prune-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/librarian/lambda/package-lock.json

      - run: uv sync --locked

      - name: Install Lambda dependencies
        run: npm --prefix apps/librarian/lambda ci

      # npm audit runs in tests.yml, not here: a new upstream advisory should
      # not block an issue's corpus rebuild.

      - name: Lint
        run: uv run --locked ruff check .

      # Every build and test reads data/, the library's export: the weekly
      # site's archive pages (audio pointers included) and site pages, the
      # blog, the podcast, the things registry and the Librarian's sidecars.
      - name: Export the library to data/
        run: |
          # git holds no data/ since 2026-10-22; a commit into it (WT
          # Builder's archive leg before its nudge PR) is replaced here.
          if [[ -n "$(git ls-files data | head -n 1)" ]]; then
            echo "::warning title=data/ in git::git tracks files under data/ again; the library export replaces them"
          fi
          rm -rf data
          uv run --locked python pipeline/library/library.py download
          uv run --locked python pipeline/library/library.py export
        env:
          LIBRARIAN_BUCKET: weekly-thing-librarian

      # Which corpora were built from an older library than this one. On a
      # held day every answer is no, unless a send named its issue.
      - name: What the library moved past
        id: library
        if: github.event_name == 'push' || inputs.scope == 'library'
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$ISSUE" ]]; then
            [[ "$ISSUE" =~ ^[0-9]+$ ]] || { echo "::error::issue must be a number, got '$ISSUE'"; exit 1; }
            args=(--issue "$ISSUE")
          fi
          uv run --locked python pipeline/library/library.py stale "${args[@]}"
        env:
          ISSUE: ${{ inputs.issue }}
          LIBRARIAN_BUCKET: weekly-thing-librarian

      - name: Detect changes
        id: changes
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.scope }}" != "library" ]]; then
            corpus=false
            if [[ "${{ inputs.scope }}" == "full" ]]; then corpus=true; fi
            {
              echo "weekly_corpus=$corpus"
              echo "blog_corpus=$corpus"
              echo "podcast_corpus=$corpus"
              echo "reference_corpus=$corpus"
              echo "lambda=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The library's answer, then (on a push) the code's.
          weekly_corpus="${{ steps.library.outputs.weekly_corpus }}"
          blog_corpus="${{ steps.library.outputs.blog_corpus }}"
          podcast_corpus="${{ steps.library.outputs.podcast_corpus }}"
          reference_corpus="${{ steps.library.outputs.reference_corpus }}"
          lambda=false

          changed=""
          if [[ "${{ github.event_name }}" == "push" ]]; then
            base="${{ github.event.before }}"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="HEAD~1"
            fi
            if ! changed="$(git diff --name-only "$base" HEAD)"; then
              echo "Could not diff against $base; falling back to HEAD commit files."
              changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
            fi
            printf '%s\n' "$changed"
          fi

          has_change() {
            local pattern
            for pattern in "$@"; do
              if grep -qE "$pattern" <<< "$changed"; then
                return 0
              fi
            done
            return 1
          }

          if has_change \
            '^pipeline/corpus/build\.py$' \
            '^pipeline/corpus/describe_media\.py$' \
            '^pipeline/deploy/upload_corpus\.py$' \
            '^librarian-core/' \
            '^pyproject\.toml$' \
            '^uv\.lock$'; then
            weekly_corpus=true
          fi

          if has_change \
            '^pipeline/blog/' \
            '^pipeline/deploy/upload_blog_corpus\.py$' \
            '^librarian-core/'; then
            blog_corpus=true
          fi

          if has_change \
            '^pipeline/podcast/' \
            '^pipeline/corpus/build_podcast\.py$' \
            '^pipeline/deploy/upload_podcast_corpus\.py$' \
            '^librarian-core/'; then
            podcast_corpus=true
          fi

          # The reference base: site pages, the FAQ (in the Lambda's shared/),
          # things, the blog's pages and the reference documents.
          if has_change \
            '^pipeline/reference/' \
            '^pipeline/corpus/build_reference\.py$' \
            '^pipeline/deploy/upload_reference_corpus\.py$' \
            '^apps/librarian/lambda/shared/faq\.json$' \
            '^librarian-core/'; then
            reference_corpus=true
          fi

          if has_change \
            '^apps/librarian/' \
            '^pipeline/deploy/aws\.py$' \
            '^pipeline/deploy/native_release\.py$' \
            '^pipeline/deploy/iam/' \
            '^.github/workflows/deploy\.yml$'; then
            lambda=true
          fi

          # A container loads each corpus once and keeps it (retrieval.mts),
          # so a new corpus is served only after a redeploy. aws.py writes a
          # fresh code key every time, which restarts the containers even
          # when the code is unchanged. 2026-09-30: the blog abstracts sat in
          # S3 unserved until a manual redeploy.
          if [[ "$weekly_corpus" == true || "$blog_corpus" == true || "$podcast_corpus" == true || "$reference_corpus" == true ]]; then
            lambda=true
          fi

          {
            echo "weekly_corpus=$weekly_corpus"
            echo "blog_corpus=$blog_corpus"
            echo "podcast_corpus=$podcast_corpus"
            echo "reference_corpus=$reference_corpus"
            echo "lambda=$lambda"
          } >> "$GITHUB_OUTPUT"

      # The real-archive tests skip without an export; here one is required.
      - name: Run Python tests
        run: uv run --locked pytest tests/ -q
        env:
          LIBRARIAN_REQUIRE_ARCHIVE: '1'

      - name: Run Lambda tests
        run: npm --prefix apps/librarian/lambda run verify

      # Layers 2+3 of the tool-surface eval: response invariants and
      # known-answer fixtures against the real corpora (from S3), plus the
      # committed recall baseline. Failures block the deploy.
      - name: Tool-surface eval (invariants + known answers)
        run: npm --prefix apps/librarian/lambda run build && node apps/librarian/lambda/scripts/eval-tools.mjs
        env:
          # A push that rebuilds a corpus moves recall on purpose; the corpus
          # gate below checks the baseline against the candidates instead.
          EVAL_SKIP_BASELINE: ${{ (steps.changes.outputs.weekly_corpus == 'true' || steps.changes.outputs.blog_corpus == 'true' || steps.changes.outputs.podcast_corpus == 'true' || steps.changes.outputs.reference_corpus == 'true') && '1' || '0' }}

      # Audio pointers on issue records (librarian_core.audio) come from the
      # weekly site's archive pages, which the library carries in
      # data/weekly/archive.
      - name: Build Weekly Thing corpus
        if: steps.changes.outputs.weekly_corpus == 'true'
        run: uv run --locked python pipeline/corpus/build.py

      - name: Build podcast corpus
        if: steps.changes.outputs.podcast_corpus == 'true'
        run: uv run --locked python pipeline/corpus/build_podcast.py

      # A malformed reference document fails here, naming its file.
      - name: Build reference corpus
        if: steps.changes.outputs.reference_corpus == 'true'
        run: uv run --locked python pipeline/corpus/build_reference.py

      # Embed every corpus the Librarian API can load, into .candidate/
      # first. Each build reuses cached embeddings from the previous S3
      # artifact when chunk ids match. The WT stage also builds the graph
      # from the embedded corpus (real similar_issues); the site handoff
      # below pushes that graph once it is uploaded.
      - name: Embed Weekly Thing corpus + graph (candidate)
        if: steps.changes.outputs.weekly_corpus == 'true'
        run: uv run --locked python pipeline/deploy/upload_corpus.py --stage .candidate
        env:
          LIBRARIAN_BUCKET: weekly-thing-librarian

      - name: Embed blog corpus (candidate)
        if: steps.changes.outputs.blog_corpus == 'true'
        run: uv run --locked python pipeline/deploy/upload_blog_corpus.py --stage .candidate
        env:
          LIBRARIAN_BUCKET: weekly-thing-librarian

      - name: Embed podcast corpus (candidate)
        if: steps.changes.outputs.podcast_corpus == 'true'
        run: uv run --locked python pipeline/deploy/upload_podcast_corpus.py --stage .candidate
        env:
          LIBRARIAN_BUCKET: weekly-thing-librarian

      - name: Embed reference corpus (candidate)
        if: steps.changes.outputs.reference_corpus == 'true'
        run: uv run --locked python pipeline/deploy/upload_reference_corpus.py --stage .candidate
        env:
          LIBRARIAN_BUCKET: weekly-thing-librarian

      # The corpus gate: the same eval over the candidate corpora (the live
      # S3 copy of any corpus not rebuilt) BEFORE anything is uploaded. A
      # corpus that breaks an invariant or a known answer never reaches the
      # Librarian (Jamie, 2026-09-30: the MCP must never silently miss
      # things). The eval above checks the new code against live corpora.
      - name: Corpus gate (eval the candidate corpora)
        if: steps.changes.outputs.weekly_corpus == 'true' || steps.changes.outputs.blog_corpus == 'true' || steps.changes.outputs.podcast_corpus == 'true' || steps.changes.outputs.reference_corpus == 'true'
        run: node apps/librarian/lambda/scripts/eval-tools.mjs
        env:
          EVAL_CORPUS_DIR: .candidate
          EVAL_CORPUS_FALLBACK: s3

      # Journal copies unmatched at or under the post-repair ceiling, and every
      # site audio edition on its issue: an export without the weekly pages
      # fails here instead of shipping a corpus with no audio pointers. A staged blog
      # candidate files every post by its Chicago day, and the ingest checks
      # (corpus_gate.ingest_failures) read it too, so this runs for a
      # blog-only rebuild as well. The blog's pages' text is in a staged
      # reference candidate, so a reference rebuild runs it too.
      - name: Corpus gate (archive checks on the staged candidates)
        if: steps.changes.outputs.weekly_corpus == 'true' || steps.changes.outputs.blog_corpus == 'true' || steps.changes.outputs.reference_corpus == 'true'
        run: uv run --locked python pipeline/corpus/corpus_gate.py gate --candidate .candidate --site-archive data/weekly/archive

      - name: Upload Weekly Thing corpus + graph to S3
        if: steps.changes.outputs.weekly_corpus == 'true'
        run: uv run --locked python pipeline/deploy/upload_corpus.py --upload-staged .candidate
        env:
          LIBRARIAN_BUCKET: weekly-thing-librarian

      - name: Upload blog corpus to S3
        if: steps.changes.outputs.blog_corpus == 'true'
        run: uv run --locked python pipeline/deploy/upload_blog_corpus.py --upload-staged .candidate
        env:
          LIBRARIAN_BUCKET: weekly-thing-librarian

      - name: Upload podcast corpus to S3
        if: steps.changes.outputs.podcast_corpus == 'true'
        run: uv run --locked python pipeline/deploy/upload_podcast_corpus.py --upload-staged .candidate
        env:
          LIBRARIAN_BUCKET: weekly-thing-librarian

      - name: Upload reference corpus to S3
        if: steps.changes.outputs.reference_corpus == 'true'
        run: uv run --locked python pipeline/deploy/upload_reference_corpus.py --upload-staged .candidate
        env:
          LIBRARIAN_BUCKET: weekly-thing-librarian

      - name: Deploy Thingy Lambda
        if: steps.changes.outputs.lambda == 'true'
        run: uv run --locked python pipeline/deploy/aws.py --skip-corpus-upload
        # No credentials: the Lambdas read them from the hand-kept
        # weekly-thing-librarian-runtime secret.
        env:
          LIBRARIAN_BUCKET: weekly-thing-librarian
          LIBRARIAN_CLOUDFORMATION_ROLE_ARN: arn:aws:iam::999153317627:role/weekly-thing-librarian-cloudformation

      # The one cross-repo push: the topic graph, to the render surface.
      # Everything else the old site handoff shipped is WT Builder's to send.
      # --from-s3 pushes the graph the WT upload built from the embedded
      # corpus (the one the Librarian serves), so the site gets real
      # similar_issues; a graph built here, before embedding, had none. An
      # unchanged graph pushes nothing.
      - name: Hand off graph.json to the website repo
        if: steps.changes.outputs.weekly_corpus == 'true' || inputs.push_graph == true
        run: uv run --locked python pipeline/deploy/push_graph.py --from-s3 --push
        env:
          GITHUB_PAT_TOKEN: ${{ secrets.STUDIO_PAT_TOKEN }}
          GITHUB_REPO_NWO: jthingelstad/weekly.thingelstad.com
          LIBRARIAN_BUCKET: weekly-thing-librarian
