name: Librarian — Corpus & API

# This repo owns the corpus the Librarian API answers from, and the API
# itself. On a push that touches canonical data or the pipeline, it rebuilds
# the affected corpora, uploads the embedded artifacts to S3, redeploys the
# Lambda when its code changed, and hands the topic graph to
# weekly.thingelstad.com — the one cross-repo push left here. Publishing is
# WT Builder's job; issue text arrives in data/issues/ as commits from it.
#
# A schedule pulls the audio editions in: WT Builder and the back-catalogue
# job write them to the site's issue pages, not here, so each morning the
# freshness check compares the site with the live corpus and rebuilds the
# Weekly Thing corpus only when they differ (pipeline/corpus/corpus_gate.py).
# An audio pointer changes no chunk text, so every embedding comes from the
# cache. Sunday to Thursday only: a send rebuilds the corpus on its own, and
# nothing automatic changes the corpus from Friday until the issue is sent.

on:
  push:
    branches: [main]
    paths:
      - 'data/issues/**'
      - 'data/blog/**'
      - 'data/podcast/**'
      # The vision-description sidecar rebuilds both corpora (change
      # detection below); without it here a sidecar-only commit ran nothing.
      - 'data/librarian/media-descriptions.json'
      # Blog abstracts (display metadata on blog post records) rebuild the
      # blog corpus, like the description sidecar.
      - 'data/librarian/blog-abstracts.json'
      - 'pipeline/**'
      - 'librarian-core/**'
      - 'apps/librarian/**'
      - '.github/workflows/deploy.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  schedule:
    - cron: '30 12 * * 0-4'  # 07:30 CDT / 06:30 CST, after the 02:15 back-catalogue run
  workflow_dispatch:
    inputs:
      scope:
        description: 'Code deploy, or full corpus rebuild and code deploy'
        type: choice
        options: [code, full]
        default: code
      push_graph:
        description: 'Commit data/librarian/graph.json to the website repo'
        type: boolean
        default: false

permissions:
  contents: read
  # OIDC deploy credentials - the job assumes WeeklyThingLibrarianDeployOidc
  # instead of using static access keys.
  id-token: write

concurrency:
  group: librarian-production
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::999153317627:role/WeeklyThingLibrarianDeployOidc
          role-session-name: librarian-${{ github.run_id }}
          allowed-account-ids: '999153317627'
          aws-region: us-east-1

      # Pinned to a commit: this job holds OIDC deploy credentials and a PAT
      # that writes to weekly.thingelstad.com.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          prune-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/librarian/lambda/package-lock.json

      - run: uv sync --locked

      - name: Install Lambda dependencies
        run: npm --prefix apps/librarian/lambda ci

      # npm audit runs in tests.yml, not here: a new upstream advisory should
      # not block an issue's corpus rebuild.

      - name: Lint
        run: uv run --locked ruff check .

      - name: Check out weekly site archive pages for the audio check (read-only)
        if: github.event_name == 'schedule'
        uses: actions/checkout@v7
        with:
          repository: jthingelstad/weekly.thingelstad.com
          persist-credentials: false
          path: .weekly-site
          sparse-checkout: apps/site/archive

      - name: Audio freshness (site audio editions vs the live corpus)
        id: audio
        if: github.event_name == 'schedule'
        run: uv run --locked python pipeline/corpus/corpus_gate.py freshness --site-archive .weekly-site/apps/site/archive --from-s3
        env:
          LIBRARIAN_BUCKET: weekly-thing-librarian

      - name: Detect changes
        id: changes
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            stale="${{ steps.audio.outputs.stale }}"
            [[ "$stale" == "true" ]] || stale=false
            {
              echo "weekly_corpus=$stale"
              echo "blog_corpus=false"
              echo "podcast_corpus=false"
              echo "lambda=$stale"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            corpus=false
            if [[ "${{ inputs.scope }}" == "full" ]]; then corpus=true; fi
            {
              echo "weekly_corpus=$corpus"
              echo "blog_corpus=$corpus"
              echo "podcast_corpus=$corpus"
              echo "lambda=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.before }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="HEAD~1"
          fi
          if ! changed="$(git diff --name-only "$base" HEAD)"; then
            echo "Could not diff against $base; falling back to HEAD commit files."
            changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          fi
          printf '%s\n' "$changed"

          has_change() {
            local pattern
            for pattern in "$@"; do
              if grep -qE "$pattern" <<< "$changed"; then
                return 0
              fi
            done
            return 1
          }

          weekly_corpus=false
          if has_change \
            '^data/issues/' \
            '^data/librarian/media-descriptions\.json$' \
            '^pipeline/corpus/build\.py$' \
            '^pipeline/corpus/describe_media\.py$' \
            '^pipeline/deploy/upload_corpus\.py$' \
            '^librarian-core/' \
            '^pyproject\.toml$' \
            '^uv\.lock$'; then
            weekly_corpus=true
          fi

          blog_corpus=false
          if has_change \
            '^data/blog/' \
            '^data/librarian/media-descriptions\.json$' \
            '^data/librarian/blog-abstracts\.json$' \
            '^pipeline/blog/' \
            '^pipeline/deploy/upload_blog_corpus\.py$' \
            '^librarian-core/'; then
            blog_corpus=true
          fi

          podcast_corpus=false
          if has_change \
            '^data/podcast/' \
            '^pipeline/podcast/' \
            '^pipeline/corpus/build_podcast\.py$' \
            '^pipeline/deploy/upload_podcast_corpus\.py$' \
            '^librarian-core/'; then
            podcast_corpus=true
          fi

          lambda=false
          if has_change \
            '^apps/librarian/' \
            '^pipeline/deploy/aws\.py$' \
            '^pipeline/deploy/iam/' \
            '^.github/workflows/deploy\.yml$'; then
            lambda=true
          fi

          # A container loads each corpus once and keeps it (retrieval.mts),
          # so a new corpus is served only after a redeploy. aws.py writes a
          # fresh code key every time, which restarts the containers even
          # when the code is unchanged. 2026-09-30: the blog abstracts sat in
          # S3 unserved until a manual redeploy.
          if [[ "$weekly_corpus" == true || "$blog_corpus" == true || "$podcast_corpus" == true ]]; then
            lambda=true
          fi

          {
            echo "weekly_corpus=$weekly_corpus"
            echo "blog_corpus=$blog_corpus"
            echo "podcast_corpus=$podcast_corpus"
            echo "lambda=$lambda"
          } >> "$GITHUB_OUTPUT"

      - name: Run Python tests
        run: uv run --locked pytest tests/ -q

      - name: Run Lambda tests
        run: npm --prefix apps/librarian/lambda run verify

      # Layers 2+3 of the tool-surface eval: response invariants and
      # known-answer fixtures against the real corpora (from S3), plus the
      # committed recall baseline. Failures block the deploy.
      - name: Tool-surface eval (invariants + known answers)
        run: npm --prefix apps/librarian/lambda run build && node apps/librarian/lambda/scripts/eval-tools.mjs
        env:
          # A push that rebuilds a corpus moves recall on purpose; the corpus
          # gate below checks the baseline against the candidates instead.
          EVAL_SKIP_BASELINE: ${{ (steps.changes.outputs.weekly_corpus == 'true' || steps.changes.outputs.blog_corpus == 'true' || steps.changes.outputs.podcast_corpus == 'true') && '1' || '0' }}

      # Audio pointers on issue records (librarian_core.audio): the audio
      # edition's record lives only in the site's archive page frontmatter.
      # A read of a sibling repo, not a push: the site repo is public, so no
      # PAT, and only the archive pages are checked out. Never a blocker -
      # without it the issues ship without audio.
      - name: Check out weekly site archive pages (read-only)
        if: steps.changes.outputs.weekly_corpus == 'true'
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: jthingelstad/weekly.thingelstad.com
          persist-credentials: false
          path: .weekly-site
          sparse-checkout: apps/site/archive

      - name: Build Weekly Thing corpus
        if: steps.changes.outputs.weekly_corpus == 'true'
        run: uv run --locked python pipeline/corpus/build.py
        env:
          WEEKLY_SITE_ARCHIVE_DIR: .weekly-site/apps/site/archive

      - name: Build podcast corpus
        if: steps.changes.outputs.podcast_corpus == 'true'
        run: uv run --locked python pipeline/corpus/build_podcast.py

      # Embed every corpus the Librarian API can load, into .candidate/
      # first. Each build reuses cached embeddings from the previous S3
      # artifact when chunk ids match. The WT stage also builds the graph
      # from the embedded corpus (real similar_issues); the site handoff
      # below pushes that graph once it is uploaded.
      - name: Embed Weekly Thing corpus + graph (candidate)
        if: steps.changes.outputs.weekly_corpus == 'true'
        run: uv run --locked python pipeline/deploy/upload_corpus.py --stage .candidate
        env:
          LIBRARIAN_BUCKET: weekly-thing-librarian
          WEEKLY_SITE_ARCHIVE_DIR: .weekly-site/apps/site/archive

      - name: Embed blog corpus (candidate)
        if: steps.changes.outputs.blog_corpus == 'true'
        run: uv run --locked python pipeline/deploy/upload_blog_corpus.py --stage .candidate
        env:
          LIBRARIAN_BUCKET: weekly-thing-librarian

      - name: Embed podcast corpus (candidate)
        if: steps.changes.outputs.podcast_corpus == 'true'
        run: uv run --locked python pipeline/deploy/upload_podcast_corpus.py --stage .candidate
        env:
          LIBRARIAN_BUCKET: weekly-thing-librarian

      # The corpus gate: the same eval over the candidate corpora (the live
      # S3 copy of any corpus not rebuilt) BEFORE anything is uploaded. A
      # corpus that breaks an invariant or a known answer never reaches the
      # Librarian (Jamie, 2026-09-30: the MCP must never silently miss
      # things). The eval above checks the new code against live corpora.
      - name: Corpus gate (eval the candidate corpora)
        if: steps.changes.outputs.weekly_corpus == 'true' || steps.changes.outputs.blog_corpus == 'true' || steps.changes.outputs.podcast_corpus == 'true'
        run: node apps/librarian/lambda/scripts/eval-tools.mjs
        env:
          EVAL_CORPUS_DIR: .candidate
          EVAL_CORPUS_FALLBACK: s3

      # Journal copies unmatched at or under the post-repair ceiling, and every
      # site audio edition on its issue: a failed site checkout fails here
      # instead of shipping a corpus with no audio pointers. A staged blog
      # candidate files every post by its Chicago day, and the ingest checks
      # (corpus_gate.ingest_failures) read it too, so this runs for a
      # blog-only rebuild as well.
      - name: Corpus gate (archive checks on the staged candidates)
        if: steps.changes.outputs.weekly_corpus == 'true' || steps.changes.outputs.blog_corpus == 'true'
        run: uv run --locked python pipeline/corpus/corpus_gate.py gate --candidate .candidate --site-archive .weekly-site/apps/site/archive

      - name: Upload Weekly Thing corpus + graph to S3
        if: steps.changes.outputs.weekly_corpus == 'true'
        run: uv run --locked python pipeline/deploy/upload_corpus.py --upload-staged .candidate
        env:
          LIBRARIAN_BUCKET: weekly-thing-librarian

      - name: Upload blog corpus to S3
        if: steps.changes.outputs.blog_corpus == 'true'
        run: uv run --locked python pipeline/deploy/upload_blog_corpus.py --upload-staged .candidate
        env:
          LIBRARIAN_BUCKET: weekly-thing-librarian

      - name: Upload podcast corpus to S3
        if: steps.changes.outputs.podcast_corpus == 'true'
        run: uv run --locked python pipeline/deploy/upload_podcast_corpus.py --upload-staged .candidate
        env:
          LIBRARIAN_BUCKET: weekly-thing-librarian

      - name: Deploy Thingy Lambda
        if: steps.changes.outputs.lambda == 'true'
        run: uv run --locked python pipeline/deploy/aws.py --skip-corpus-upload
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          LIBRARIAN_BUCKET: weekly-thing-librarian
          LIBRARIAN_RETRIEVE_SECRET: ${{ secrets.LIBRARIAN_RETRIEVE_SECRET }}
          LIBRARIAN_CLOUDFORMATION_ROLE_ARN: arn:aws:iam::999153317627:role/weekly-thing-librarian-cloudformation
          LIBRARIAN_SESSION_SECRET: ${{ secrets.LIBRARIAN_SESSION_SECRET }}
          THINGY_WEB_ORIGIN_TOKEN: ${{ secrets.THINGY_WEB_ORIGIN_TOKEN }}

      # The one cross-repo push: the topic graph, to the render surface.
      # Everything else the old site handoff shipped is WT Builder's to send.
      # --from-s3 pushes the graph the WT upload built from the embedded
      # corpus (the one the Librarian serves), so the site gets real
      # similar_issues; a graph built here, before embedding, had none.
      - name: Hand off graph.json to the website repo
        if: steps.changes.outputs.weekly_corpus == 'true' || inputs.push_graph == true
        run: |
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.push_graph }}" == "true" ]]; then
            uv run --locked python pipeline/deploy/push_graph.py --from-s3 --push
          else
            uv run --locked python pipeline/deploy/push_graph.py --from-s3
          fi
        env:
          GITHUB_PAT_TOKEN: ${{ secrets.STUDIO_PAT_TOKEN }}
          GITHUB_REPO_NWO: jthingelstad/weekly.thingelstad.com
          LIBRARIAN_BUCKET: weekly-thing-librarian
