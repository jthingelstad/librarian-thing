name: Librarian — Corpus & API

# This repo owns the corpus the Librarian API answers from, and the API
# itself. On a push that touches canonical data or the pipeline, it rebuilds
# the affected corpora, uploads the embedded artifacts to S3, redeploys the
# Lambda when its code changed, and hands the topic graph to
# weekly.thingelstad.com — the one cross-repo push left here. Publishing is
# WT Builder's job; issue text arrives in data/issues/ as commits from it.

on:
  push:
    branches: [main]
    paths:
      - 'data/issues/**'
      - 'data/blog/**'
      - 'data/podcast/**'
      - 'pipeline/**'
      - 'librarian-core/**'
      - 'apps/librarian/**'
      - '.github/workflows/deploy.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:
    inputs:
      push_graph:
        description: 'Commit data/librarian/graph.json to the website repo'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: librarian-production
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          prune-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/librarian/lambda/package-lock.json

      - run: uv sync --locked

      - name: Install Lambda dependencies
        run: npm --prefix apps/librarian/lambda ci

      - name: Audit Lambda dependencies
        run: npm --prefix apps/librarian/lambda audit --audit-level=high

      - name: Lint
        run: uv run --locked ruff check .

      - name: Detect changes
        id: changes
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            {
              echo "weekly_corpus=true"
              echo "blog_corpus=true"
              echo "podcast_corpus=true"
              echo "lambda=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.before }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="HEAD~1"
          fi
          if ! changed="$(git diff --name-only "$base" HEAD)"; then
            echo "Could not diff against $base; falling back to HEAD commit files."
            changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          fi
          printf '%s\n' "$changed"

          has_change() {
            local pattern
            for pattern in "$@"; do
              if grep -qE "$pattern" <<< "$changed"; then
                return 0
              fi
            done
            return 1
          }

          weekly_corpus=false
          if has_change \
            '^data/issues/' \
            '^pipeline/corpus/build\.py$' \
            '^pipeline/deploy/upload_corpus\.py$' \
            '^librarian-core/' \
            '^pyproject\.toml$' \
            '^uv\.lock$'; then
            weekly_corpus=true
          fi

          blog_corpus=false
          if has_change \
            '^data/blog/' \
            '^pipeline/blog/' \
            '^pipeline/deploy/upload_blog_corpus\.py$' \
            '^librarian-core/'; then
            blog_corpus=true
          fi

          podcast_corpus=false
          if has_change \
            '^data/podcast/' \
            '^pipeline/podcast/' \
            '^pipeline/corpus/build_podcast\.py$' \
            '^pipeline/deploy/upload_podcast_corpus\.py$' \
            '^librarian-core/'; then
            podcast_corpus=true
          fi

          lambda=false
          if has_change \
            '^apps/librarian/' \
            '^pipeline/deploy/aws\.py$'; then
            lambda=true
          fi

          {
            echo "weekly_corpus=$weekly_corpus"
            echo "blog_corpus=$blog_corpus"
            echo "podcast_corpus=$podcast_corpus"
            echo "lambda=$lambda"
          } >> "$GITHUB_OUTPUT"

      - name: Run Python tests
        run: uv run --locked python -m unittest discover -s tests -p 'test_*.py' -t .

      - name: Run Lambda tests
        run: npm --prefix apps/librarian/lambda run verify

      - name: Build Weekly Thing corpus
        if: steps.changes.outputs.weekly_corpus == 'true'
        run: uv run --locked python pipeline/corpus/build.py

      - name: Build podcast corpus
        if: steps.changes.outputs.podcast_corpus == 'true'
        run: uv run --locked python pipeline/corpus/build_podcast.py

      # data/librarian/graph.json powers the website's topic pages.
      - name: Build graph for site topics
        if: steps.changes.outputs.weekly_corpus == 'true' || inputs.push_graph == true
        run: uv run --locked python pipeline/graph/build.py

      # Embed every corpus the Librarian API can load. Each upload reuses
      # cached embeddings from the previous S3 artifact when chunk ids match.
      - name: Upload embedded Weekly Thing corpus + graph to S3
        if: steps.changes.outputs.weekly_corpus == 'true'
        run: uv run --locked python pipeline/deploy/upload_corpus.py
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          LIBRARIAN_BUCKET: weekly-thing-librarian

      - name: Upload embedded blog corpus to S3
        if: steps.changes.outputs.blog_corpus == 'true'
        run: uv run --locked python pipeline/deploy/upload_blog_corpus.py
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          LIBRARIAN_BUCKET: weekly-thing-librarian

      - name: Upload embedded podcast corpus to S3
        if: steps.changes.outputs.podcast_corpus == 'true'
        run: uv run --locked python pipeline/deploy/upload_podcast_corpus.py
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          LIBRARIAN_BUCKET: weekly-thing-librarian

      - name: Deploy Thingy Lambda
        if: steps.changes.outputs.lambda == 'true'
        run: uv run --locked python pipeline/deploy/aws.py --skip-corpus-upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          LIBRARIAN_BUCKET: weekly-thing-librarian
          LIBRARIAN_RETRIEVE_SECRET: ${{ secrets.LIBRARIAN_RETRIEVE_SECRET }}
          LIBRARIAN_SESSION_SECRET: ${{ secrets.LIBRARIAN_SESSION_SECRET }}

      # The one cross-repo push: the topic graph, to the render surface.
      # Everything else the old site handoff shipped is WT Builder's to send.
      - name: Hand off graph.json to the website repo
        if: steps.changes.outputs.weekly_corpus == 'true' || inputs.push_graph == true
        run: |
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.push_graph }}" == "true" ]]; then
            uv run --locked python pipeline/deploy/push_graph.py --push
          else
            uv run --locked python pipeline/deploy/push_graph.py
          fi
        env:
          GITHUB_PAT_TOKEN: ${{ secrets.STUDIO_PAT_TOKEN }}
          GITHUB_REPO_NWO: jthingelstad/weekly.thingelstad.com
