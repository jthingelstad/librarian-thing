# Temporary: print the OIDC token claims (payload only, no signature) to
# diagnose an AssumeRoleWithWebIdentity trust mismatch. Delete after use.
name: Debug OIDC claims

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decode OIDC claims
        run: |
          TOKEN_JSON=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          PAYLOAD=$(echo "$TOKEN_JSON" | jq -r .value | cut -d. -f2 | tr '_-' '/+')
          PAD=$(( (4 - ${#PAYLOAD} % 4) % 4 ))
          echo "$PAYLOAD$(printf '=%.0s' $(seq 1 $PAD 2>/dev/null))" | base64 -d 2>/dev/null | jq '{iss, aud, sub, repository, ref, repository_owner}'
