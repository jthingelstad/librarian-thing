version = 2
repo = "."
timezone = "America/Chicago"

# Calendar cadence only; deploy/alarm/incident follow-ups are manual starts.
# The prompts are the desired-state copy installed in Codex. There is no bare
# gpt-5.6 id; only -sol/-terra/-luna exist.

[[automation]]
id = "run-the-librarian"
name = "Run the Librarian"
objective = "run"
objective_file = "AGENT-TEAM/run-librarian.md"
status = "ACTIVE"
rrule = "RRULE:FREQ=WEEKLY;BYHOUR=8;BYMINUTE=20;BYDAY=SA"
model = "gpt-5.6-terra"
reasoning_effort = "high"
execution_environment = "local"
prompt = "Follow the project instructions already loaded by Codex. Read `/Users/otto/Projects/librarian-thing/AGENT-TEAM/WORKFLOW.md`, `/Users/otto/Projects/librarian-thing/AGENT-TEAM/README.md`, and `/Users/otto/Projects/librarian-thing/AGENT-TEAM/run-librarian.md` completely, then pursue the `run` objective exactly as written. Measure current evidence before changing anything. Own a clear gap through source fix, regression coverage, verification, deployment when required, and live acceptance. Use issues only for multi-run work, external blockers, durable audits, or Jamie decisions. Run preflight first; acquire the objective lease only before mutation; never publish pre-existing work; preserve human, secret-safety, and reader-privacy boundaries; and end with a clean repository. Keep automation memory to Current state, Active watches, and one replace-in-place Latest run."

