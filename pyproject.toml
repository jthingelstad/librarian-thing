[project]
name = "librarian-thing"
version = "0.0.0"
description = "The Librarian API and the corpora it answers from"
requires-python = ">=3.14,<3.15"
dependencies = [
    "anthropic>=1.3.0",
    "beautifulsoup4>=4.15.0",
    "boto3>=1.43.45",
    "httpx>=0.28.1",
    "librarian-core",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "ruff>=0.15.22,<0.16",
]

[tool.uv]
package = false

[tool.uv.sources]
librarian-core = { path = "librarian-core", editable = true }

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
