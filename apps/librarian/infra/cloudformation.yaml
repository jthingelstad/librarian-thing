    Condition: NativeWebActive
    Properties:
      AlarmName: !Sub '${AWS::StackName}-web-auth-capacity'
      Namespace: AWS/Lambda/Web/Usage
      MetricName: EndpointActiveEnvironmentThrottles
      Dimensions:
        - { Name: FunctionName, Value: !Sub '${AWS::StackName}-web-auth' }
        - { Name: EndpointName, Value: live }
        - { Name: ExecutionRegion, Value: !Ref AWS::Region }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref LibrarianAlarmTopic]

  NativeAuthRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: NativeWebActive
    Properties:
      AlarmName: !Sub '${AWS::StackName}-web-auth-rate'
      Namespace: AWS/Lambda/Web/Usage
      MetricName: EndpointRequestThrottles
      Dimensions:
        - { Name: FunctionName, Value: !Sub '${AWS::StackName}-web-auth' }
        - { Name: EndpointName, Value: live }
        - { Name: ExecutionRegion, Value: !Ref AWS::Region }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref LibrarianAlarmTopic]

  NativeArchiveErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: NativeWebActive
    Properties:
      AlarmName: !Sub '${AWS::StackName}-web-archive-errors'
      Namespace: AWS/Lambda/Web
      MetricName: HTTPResponseStatusClass5XX
      Dimensions:
        - { Name: FunctionName, Value: !Sub '${AWS::StackName}-web-archive' }
        - { Name: EndpointName, Value: live }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref LibrarianAlarmTopic]

  NativeArchiveCapacityAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: NativeWebActive
    Properties:
      AlarmName: !Sub '${AWS::StackName}-web-archive-capacity'
      Namespace: AWS/Lambda/Web/Usage
      MetricName: EndpointActiveEnvironmentThrottles
      Dimensions:
        - { Name: FunctionName, Value: !Sub '${AWS::StackName}-web-archive' }
        - { Name: EndpointName, Value: live }
        - { Name: ExecutionRegion, Value: !Ref AWS::Region }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref LibrarianAlarmTopic]

  NativeArchiveRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: NativeWebActive
    Properties:
      AlarmName: !Sub '${AWS::StackName}-web-archive-rate'
      Namespace: AWS/Lambda/Web/Usage
      MetricName: EndpointRequestThrottles
      Dimensions:
        - { Name: FunctionName, Value: !Sub '${AWS::StackName}-web-archive' }
        - { Name: EndpointName, Value: live }
        - { Name: ExecutionRegion, Value: !Ref AWS::Region }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref LibrarianAlarmTopic]

  # librarian.thingelstad.com (E18I2CIBERFMB7) is hand-managed through
  # lambda/scripts/front-door.mjs, so its id is fixed here. Same shape as
  # thingy-web-distribution-5xx. CloudFront metrics live in us-east-1.
  LibrarianDistributionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-distribution-5xx'
      AlarmDescription: CloudFront returned more than 5% 5xx responses for librarian.thingelstad.com in two of three five-minute windows.
      Namespace: AWS/CloudFront
      MetricName: 5xxErrorRate
      Dimensions:
        - { Name: DistributionId, Value: E18I2CIBERFMB7 }
        - { Name: Region, Value: Global }
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref LibrarianAlarmTopic]

  NativeLibrarianSubscribeFailuresMetricFilter:
    Type: AWS::Logs::MetricFilter
    Condition: NativeWebActive
    Properties:
      LogGroupName: !Ref NativeAuthLogs
      FilterPattern: '?"buttondown_subscriber_create_failed" ?"buttondown_lookup_failed" ?"buttondown_subscriber_reminder_failed" ?"buttondown_subscriber_resubscribe_failed" ?"subscribe_ledger_write_failed" ?"subscribe_digest_blocked_list_failed"'
      MetricTransformations:
        - MetricName: LibrarianSubscribeFailures
          MetricNamespace: WeeklyThingLibrarian
          MetricValue: "1"

  NativeLibrarianOauthFailuresMetricFilter:
    Type: AWS::Logs::MetricFilter
    Condition: NativeWebActive
    Properties:
      LogGroupName: !Ref NativeAuthLogs
      FilterPattern: '?"oauth_token_pkce_failed" ?"oauth_token_code_binding_mismatch" ?"oauth_refresh_client_mismatch" ?"oauth_register_rejected" ?"oauth_token_code_rejected" ?"oauth_register_global_capped" ?"oauth_register_rate_limited" ?"oauth_token_rate_limited"'
      MetricTransformations:
        - MetricName: LibrarianOauthAuthFailures
          MetricNamespace: WeeklyThingLibrarian
          MetricValue: "1"

  NativeLibrarianStreamFailuresMetricFilter:
    Type: AWS::Logs::MetricFilter
    Condition: NativeWebActive
    Properties:
      LogGroupName: !Ref NativeArchiveLogs
      FilterPattern: '?"request_failed" ?"retrieve_failed"'
      MetricTransformations:
        - MetricName: LibrarianStreamHandledFailures
          MetricNamespace: WeeklyThingLibrarian
          MetricValue: "1"

  NativeLibrarianChatRejectionsMetricFilter:
    Type: AWS::Logs::MetricFilter
    Condition: NativeWebActive
    Properties:
      LogGroupName: !Ref NativeArchiveLogs
      FilterPattern: '"chat_request_rejected"'
      MetricTransformations:
        - MetricName: LibrarianChatRejections
          MetricNamespace: WeeklyThingLibrarian
          MetricValue: "1"

  NativeLibrarianGuestBreakerMetricFilter:
    Type: AWS::Logs::MetricFilter
    Condition: NativeWebActive
    Properties:
      LogGroupName: !Ref NativeArchiveLogs
      FilterPattern: '"guest_global_quota_exhausted"'
      MetricTransformations:
        - MetricName: LibrarianGuestBreakerTrips
