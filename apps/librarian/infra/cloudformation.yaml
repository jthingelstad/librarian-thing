AWSTemplateFormatVersion: "2010-09-09"
Description: Weekly Thing Archive Librarian API

Parameters:
  AllowedOrigin:
    Type: CommaDelimitedList
    Default: https://weekly.thingelstad.com,https://thingy.thingelstad.com,https://www.thingelstad.com,http://localhost:8080,http://127.0.0.1:8080
  CodeBucket:
    Type: String
    Description: S3 bucket containing the packaged Lambda code.
  CodeKey:
    Type: String
    Description: S3 key for the packaged Lambda code.
  CorpusBucket:
    Type: String
    Description: S3 bucket containing the embedded librarian corpus JSON.
  CorpusKey:
    Type: String
    Default: artifacts/corpus.json
  GraphKey:
    Type: String
    Default: artifacts/graph.json
  BlogCorpusKey:
    Type: String
    Default: artifacts/blog_corpus.json
    Description: >
      S3 key for the thingelstad.com blog corpus (separate from the Weekly
      Thing corpus). The native archive lazy-loads it only when a request's
      scope includes blog, both, or all. Uploaded on its own cadence by
      pipeline/deploy/upload_blog_corpus.py, not the WT deploy.
  PodcastCorpusKey:
    Type: String
    Default: artifacts/podcast_corpus.json
    Description: >
      S3 key for the Another Thing podcast corpus. The native archive
      lazy-loads it only when a request's scope includes podcast or all.
      Uploaded on its own cadence by pipeline/deploy/upload_podcast_corpus.py.
  ReferenceCorpusKey:
    Type: String
    Default: artifacts/reference_corpus.json
    Description: >
      S3 key for the reference base - site pages, the FAQ, Things I've built,
      the blog's pages and reference documents. The native archive loads it
      for every retrieval whatever the scope, and no source kind selects it.
      Uploaded on its own cadence by pipeline/deploy/upload_reference_corpus.py.
  LinksCorpusKey:
    Type: String
    Default: artifacts/links_corpus.json
    Description: >
      S3 key for the links corpus - every public link Jamie saved, one passage
      each, from Linking Things (links.thingelstad.xyz). The native archive
      lazy-loads it only when a request names source kind link or a link-id.
      Uploaded on its own cadence by pipeline/deploy/upload_links_corpus.py.
  KeywordIndexKey:
    Type: String
    Default: artifacts/keyword_index.db
    Description: >
      S3 key for the keyword index - one SQLite full-text file over every
      corpus, the keyword leg of retrieval. The native archive downloads it
      to /tmp once and opens it read-only; without it, or when it was built
      from other corpora, retrieval keeps the TF-IDF scan. Built and uploaded
      by every deploy (pipeline/deploy/upload_keyword_index.py).
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues:
      - DEBUG
      - INFO
      - WARNING
      - ERROR
  AuthRateLimitMax:
    Type: Number
    Default: 30
    MinValue: 1
    Description: Maximum auth attempts per client identity per hour.
  TurnstileModeWeekly:
    Type: String
    Default: enforce
    AllowedValues:
      - off
      - observe
      - enforce
    Description: >-
      Turnstile mode for the Weekly Thing website's forms (every /auth source
      but thingy). Enforce refuses a missing or failed token; observe records
      and lets everything through. Thingy sign-in and the MCP email step keep
      the observe default in shared/turnstile.mts. Enforced 2026-10-20.
  ThingyMagicLinkFromEmail:
    Type: String
    Default: thingy@thingelstad.com
    Description: From address configured in Fastmail for Thingy magic-link emails.
  ThingyMagicLinkBaseUrl:
    Type: String
    Default: https://thingy.thingelstad.com/
    Description: Public Thingy URL used when building sign-in magic links.
  ThingyEffort:
    Type: String
    Default: medium
    AllowedValues: [low, medium, high, xhigh, max]
    Description: Effort level for the chat agent on the 5.5 models, read as THINGY_EFFORT.
  NativeWebEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
  NativeBuildId:
    Type: String
    Default: 'disabled'
  # The corpus object versions NativeBuildId was computed from, as JSON
  # {"artifacts/<name>": "<VersionId>"}; /health reports them as
  # corpus_versions. Set by native_release.prepare on every native deploy.
  NativeCorpusVersions:
    Type: String
    Default: ''
  NativeAuthCodeKey:
    Type: String
    Default: 'disabled'
  NativeAuthCodeVersion:
    Type: String
    Default: ''
  NativeAuthLiveRevision:
    Type: String
    Default: ''
  NativeAuthRollbackRevision:
    Type: String
    Default: ''
  NativeArchiveCodeKey:
    Type: String
    Default: 'disabled'
  NativeArchiveCodeVersion:
    Type: String
    Default: ''
  NativeArchiveLiveRevision:
    Type: String
    Default: ''
  NativeArchiveRollbackRevision:
    Type: String
    Default: ''

Conditions:
  HasNativeArchiveRollbackRevision: !Not [!Equals [!Ref NativeArchiveRollbackRevision, '']]
  HasNativeArchiveLiveRevision: !Not [!Equals [!Ref NativeArchiveLiveRevision, '']]
  HasNativeAuthRollbackRevision: !Not [!Equals [!Ref NativeAuthRollbackRevision, '']]
  HasNativeAuthLiveRevision: !Not [!Equals [!Ref NativeAuthLiveRevision, '']]
  NativeWebActive: !Equals [!Ref NativeWebEnabled, 'true']
Resources:
  LibrarianTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: email_hash
          AttributeType: S
        - AttributeName: subscriber_hash
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: EmailHashIndex
          KeySchema:
            - AttributeName: email_hash
              KeyType: HASH
            - AttributeName: sk
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY
        - IndexName: SubscriberHashIndex
          KeySchema:
            - AttributeName: subscriber_hash
              KeyType: HASH
            - AttributeName: sk
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  LibrarianGoldenRetrieveSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: weekly-thing-librarian-golden-retrieval
      Description: Generated credential used only by the Librarian live retrieval golden harness.
      GenerateSecretString:
        GenerateStringKey: value
        SecretStringTemplate: '{}'
        PasswordLength: 48
        ExcludePunctuation: true

  # The Lambdas' credentials live in weekly-thing-librarian-runtime, a
  # Secrets Manager secret Jamie keeps by hand: a JSON object of env-style
  # names, read once per cold start (shared/runtime-secrets.mts lists them).
  # The stack never writes it and no deploy carries a credential, so a key
  # is rotated by editing the secret; new containers pick it up. The stack
  # created it and let it go on 2026-10-07 (DeletionPolicy Retain).

  LibrarianFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !Sub arn:aws:iam::${AWS::AccountId}:policy/WeeklyThingLibrarianRuntimeBoundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LibrarianDataAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt LibrarianTable.Arn
                  - !Sub "${LibrarianTable.Arn}/index/*"
              - Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:ListStreams
                Resource: !GetAtt LibrarianTable.StreamArn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt LibrarianEvalDlq.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub arn:aws:s3:::${CorpusBucket}/${CorpusKey}
                  - !Sub arn:aws:s3:::${CorpusBucket}/${GraphKey}
                  - !Sub arn:aws:s3:::${CorpusBucket}/${BlogCorpusKey}
                  - !Sub arn:aws:s3:::${CorpusBucket}/${PodcastCorpusKey}
                  - !Sub arn:aws:s3:::${CorpusBucket}/${ReferenceCorpusKey}
                  - !Sub arn:aws:s3:::${CorpusBucket}/${LinksCorpusKey}
                  - !Sub arn:aws:s3:::${CorpusBucket}/${KeywordIndexKey}
                  - !Sub arn:aws:s3:::${CorpusBucket}/artifacts/dispatches/*
              # Dispatch was removed 2026-08; profile deletion still cleans
              # up historical dispatch artifacts, so keep delete access here.
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource:
                  - !Sub arn:aws:s3:::${CorpusBucket}/artifacts/dispatches/*
              # The Claude entries are unused since the 2026-10 move to the
              # Anthropic API; they stay until it has settled, so a revert
              # needs no IAM change. Cohere embed and rerank still use theirs.
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-4-6
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-4-5-20251001-v1:0
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-opus-4-6-v1
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-pro-v1:0
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-sonnet-4-6
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-opus-4-6-v1
                  - arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-sonnet-4-6
                  - arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
                  - arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-opus-4-6-v1
                  - arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-sonnet-4-6
                  - arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
                  - arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-opus-4-6-v1
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/cohere.embed-english-v3
                  # Embed v4 through its us. cross-region profile, which routes
                  # to these three regions (2026-11-01).
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.cohere.embed-v4:0
                  - arn:aws:bedrock:us-east-1::foundation-model/cohere.embed-v4:0
                  - arn:aws:bedrock:us-east-2::foundation-model/cohere.embed-v4:0
                  - arn:aws:bedrock:us-west-2::foundation-model/cohere.embed-v4:0
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/cohere.rerank-v3-5:0
                  - arn:aws:bedrock:us-west-2::foundation-model/cohere.rerank-v3-5:0
                  - arn:aws:bedrock:ca-central-1::foundation-model/cohere.rerank-v3-5:0
                  - arn:aws:bedrock:eu-central-1::foundation-model/cohere.rerank-v3-5:0
                  - arn:aws:bedrock:ap-northeast-1::foundation-model/cohere.rerank-v3-5:0
              - Effect: Allow
                Action: bedrock:Rerank
                Resource: "*"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:weekly-thing-librarian-runtime-??????

  LibrarianEvalFunction:
    Type: AWS::Lambda::Function
    Properties:
      Architectures:
        - arm64
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          TABLE_NAME: !Ref LibrarianTable
          LOG_LEVEL: !Ref LogLevel
          # The reviewer's Anthropic API key comes from the runtime secret.
          LIBRARIAN_RUNTIME_SECRET_ID: weekly-thing-librarian-runtime
          # Anthropic API model ids (2026-10), all on the 5 family: they
          # think, take an effort level, and refuse sampling params. Haiku
          # 5.5 replaced Haiku 4.5 as the fast model on 2026-10-08.
          THINGY_DEFAULT_MODEL: "claude-sonnet-5-5"
          THINGY_FAST_MODEL: "claude-haiku-5-5"
          THINGY_PREMIUM_MODEL: "claude-opus-5-5"
          THINGY_EFFORT: !Ref ThingyEffort
      Handler: eval/handler.handler
      MemorySize: 1024
      ReservedConcurrentExecutions: 1
      Role: !GetAtt LibrarianFunctionRole.Arn
      Runtime: nodejs24.x
      Timeout: 180

  LibrarianEvalEventSource:
    Type: AWS::Lambda::EventSourceMapping
    # The OnFailure destination is permission-checked when the mapping is
    # updated; make sure the role (with sqs:SendMessage on the DLQ) updates
    # first or the mapping update can fail against the stale role.
    DependsOn: LibrarianFunctionRole
    Properties:
      EventSourceArn: !GetAtt LibrarianTable.StreamArn
      FunctionName: !Ref LibrarianEvalFunction
      StartingPosition: LATEST
      BatchSize: 25
      MaximumBatchingWindowInSeconds: 30
      Enabled: true
      # Eval only reads user#... conversation/turn rows; without a filter
      # every rate-limit counter write invoked it too.
      FilterCriteria:
        Filters:
          - Pattern: '{"dynamodb":{"Keys":{"pk":{"S":[{"prefix":"user#"}]}}}}'
      MaximumRetryAttempts: 3
      BisectBatchOnFunctionError: true
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt LibrarianEvalDlq.Arn

  LibrarianSubscribeDigestRule:
    Type: AWS::Events::Rule
    Properties:
      Name: weekly-thing-librarian-subscribe-digest
      Description: Daily subscribe digest to Jamie
      ScheduleExpression: cron(0 12 * * ? *)
      State: ENABLED
      Targets:
        - Id: subscribe-digest
          Arn: !GetAtt LibrarianDigestFunction.Arn
          Input: '{"task":"subscribe_digest"}'

  LibrarianSubscribeDigestPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LibrarianDigestFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt LibrarianSubscribeDigestRule.Arn

  # This stack's own alarms were retired 2026-11-03 (Jamie cut the account to
  # a handful of alarms; nobody acted on these). The topic stays: it is free,
  # sibling site stacks name it, and its projects-ops-alerts SQS subscription
  # is managed in projects-sysadmin. Failures stay in the structured logs and
  # this stack's metric filters. None of the filters sets DefaultValue
  # (2026-09-24): a default writes a zero on every log event and bills the
  # metric for every hour the function logs anything.
  LibrarianAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: weekly-thing-librarian-alarms

  # Poison records on the eval stream mapping retry a bounded number of
  # times, bisect to isolate the bad record, and land here instead of
  # blocking the shard for the stream's full 24h retention.
  LibrarianEvalDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: weekly-thing-librarian-eval-dlq
      MessageRetentionPeriod: 1209600

  BedrockEvaluationRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !Sub arn:aws:iam::${AWS::AccountId}:policy/WeeklyThingLibrarianEvaluationBoundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ThingyBedrockEvaluationAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub arn:aws:s3:::${CorpusBucket}/eval/datasets/*
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource:
                  - !Sub arn:aws:s3:::${CorpusBucket}/eval/runs/*
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${CorpusBucket}
                Condition:
                  StringLike:
                    s3:prefix:
                      - eval/datasets/*
                      - eval/runs/*
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-4-6
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-4-5-20251001-v1:0
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-opus-4-6-v1
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-pro-v1:0
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-sonnet-4-6
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-opus-4-6-v1
                  - arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-sonnet-4-6
                  - arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
                  - arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-opus-4-6-v1
                  - arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-sonnet-4-6
                  - arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
                  - arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-opus-4-6-v1

  NativeSourceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${AWS::StackName}-web-source-${AWS::AccountId}-${AWS::Region}'
      VersioningConfiguration: { Status: Enabled }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  NativeSourcePolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref NativeSourceBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: [s3:GetObject, s3:GetObjectVersion]
            Resource: !Sub '${NativeSourceBucket.Arn}/native/*'
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId }
              ArnLike:
                'aws:SourceArn': !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:web-function/${AWS::StackName}-web-*/revision/*'
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt NativeSourceBucket.Arn, !Sub '${NativeSourceBucket.Arn}/*']
            Condition: { Bool: { 'aws:SecureTransport': 'false' } }

  NativeAuthLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-web-auth'
      RetentionInDays: 30
  NativeAuthFunction:
    Type: AWS::Lambda::WebFunction
    Condition: NativeWebActive
    Properties:
      FunctionName: !Sub '${AWS::StackName}-web-auth'
  NativeAuthRevision:
    Type: AWS::Lambda::WebFunctionRevision
    Condition: NativeWebActive
    DependsOn: [NativeAuthFunction, NativeSourcePolicy]
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Sub '${AWS::StackName}-web-auth'
      Description: !Ref NativeBuildId
      BuildConfig:
        CodeConfig:
          S3Object:
            Bucket: !Ref NativeSourceBucket
            Key: !Ref NativeAuthCodeKey
            VersionId: !Ref NativeAuthCodeVersion
        RuntimeConfig: { Runtime: nodejs24.x }
      ServiceConfig:
        ExecutionRoleArn: !GetAtt LibrarianFunctionRole.Arn
        TimeoutSeconds: 35
        MaxConcurrencyPerEnvironment: 8
        TelemetryConfig:
          LoggingConfig:
            LogGroup: !Ref NativeAuthLogs
            ApplicationLogLevel: INFO
            SystemLogLevel: INFO
        EnvironmentVariables:
          ALLOWED_ORIGIN: !Join [",", !Ref AllowedOrigin]
          TABLE_NAME: !Ref LibrarianTable
          CORPUS_BUCKET: !Ref CorpusBucket
          CORPUS_KEY: !Ref CorpusKey
          GRAPH_KEY: !Ref GraphKey
          LIBRARIAN_RUNTIME_SECRET_ID: weekly-thing-librarian-runtime
          LOG_LEVEL: !Ref LogLevel
          AUTH_RATE_LIMIT_MAX: !Ref AuthRateLimitMax
          TURNSTILE_MODE_WEEKLY: !Ref TurnstileModeWeekly
          THINGY_MAGIC_LINK_FROM_EMAIL: !Ref ThingyMagicLinkFromEmail
          THINGY_MAGIC_LINK_BASE_URL: !Ref ThingyMagicLinkBaseUrl
          # Anthropic API model ids (2026-10), all on the 5 family: they
          # think, take an effort level, and refuse sampling params. Haiku
          # 5.5 replaced Haiku 4.5 as the fast model on 2026-10-08.
          THINGY_DEFAULT_MODEL: "claude-sonnet-5-5"
          THINGY_FAST_MODEL: "claude-haiku-5-5"
          THINGY_PREMIUM_MODEL: "claude-opus-5-5"
          THINGY_EFFORT: !Ref ThingyEffort
          LIBRARIAN_NATIVE_HTTP: '1'
          LIBRARIAN_SOURCE_REVISION: !Ref NativeBuildId
          LIBRARIAN_CORPUS_VERSIONS: !Ref NativeCorpusVersions

  NativeAuthLiveEndpoint:
    Type: AWS::Lambda::WebFunctionEndpoint
    Condition: NativeWebActive
    DependsOn: NativeAuthFunction
    Properties:
      FunctionName: !Sub '${AWS::StackName}-web-auth'
      EndpointName: live
      EndpointType: HomeRegion
      AuthType: IamAuth
      RevisionWeights:
        - RevisionId: !If [HasNativeAuthLiveRevision, !Ref NativeAuthLiveRevision, !GetAtt NativeAuthRevision.RevisionId]
          Weight: 100
      ScalingConfig: { MaxEnvironments: 2 }
      ThrottleConfig: { RateLimit: 100 }

  NativeAuthRollbackEndpoint:
    Type: AWS::Lambda::WebFunctionEndpoint
    Condition: NativeWebActive
    DependsOn: NativeAuthFunction
    Properties:
      FunctionName: !Sub '${AWS::StackName}-web-auth'
      EndpointName: rollback
      EndpointType: HomeRegion
      AuthType: IamAuth
      RevisionWeights:
        - RevisionId: !If [HasNativeAuthRollbackRevision, !Ref NativeAuthRollbackRevision, !GetAtt NativeAuthRevision.RevisionId]
          Weight: 100
      ScalingConfig: { MaxEnvironments: 2 }
      ThrottleConfig: { RateLimit: 0 }

  NativeArchiveLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-web-archive'
      RetentionInDays: 30
  NativeArchiveFunction:
    Type: AWS::Lambda::WebFunction
    Condition: NativeWebActive
    Properties:
      FunctionName: !Sub '${AWS::StackName}-web-archive'
  NativeArchiveRevision:
    Type: AWS::Lambda::WebFunctionRevision
    Condition: NativeWebActive
    DependsOn: [NativeArchiveFunction, NativeSourcePolicy]
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Sub '${AWS::StackName}-web-archive'
      Description: !Ref NativeBuildId
      BuildConfig:
        CodeConfig:
          S3Object:
            Bucket: !Ref NativeSourceBucket
            Key: !Ref NativeArchiveCodeKey
            VersionId: !Ref NativeArchiveCodeVersion
        RuntimeConfig: { Runtime: nodejs24.x }
      ServiceConfig:
        ExecutionRoleArn: !GetAtt LibrarianFunctionRole.Arn
        TimeoutSeconds: 300
        MaxConcurrencyPerEnvironment: 1
        TelemetryConfig:
          LoggingConfig:
            LogGroup: !Ref NativeArchiveLogs
            ApplicationLogLevel: INFO
            SystemLogLevel: INFO
        EnvironmentVariables:
          ALLOWED_ORIGIN: !Join [",", !Ref AllowedOrigin]
          TABLE_NAME: !Ref LibrarianTable
          CORPUS_BUCKET: !Ref CorpusBucket
          CORPUS_KEY: !Ref CorpusKey
          GRAPH_KEY: !Ref GraphKey
          BLOG_CORPUS_KEY: !Ref BlogCorpusKey
          PODCAST_CORPUS_KEY: !Ref PodcastCorpusKey
          REFERENCE_CORPUS_KEY: !Ref ReferenceCorpusKey
          LINKS_CORPUS_KEY: !Ref LinksCorpusKey
          KEYWORD_INDEX_KEY: !Ref KeywordIndexKey
          LIBRARIAN_RUNTIME_SECRET_ID: weekly-thing-librarian-runtime
          LOG_LEVEL: !Ref LogLevel
          # Anthropic API model ids (2026-10), all on the 5 family: they
          # think, take an effort level, and refuse sampling params. Haiku
          # 5.5 replaced Haiku 4.5 as the fast model on 2026-10-08.
          THINGY_DEFAULT_MODEL: "claude-sonnet-5-5"
          THINGY_FAST_MODEL: "claude-haiku-5-5"
          THINGY_PREMIUM_MODEL: "claude-opus-5-5"
          THINGY_EFFORT: !Ref ThingyEffort
          BEDROCK_EMBEDDING_MODEL: "us.cohere.embed-v4:0"
          BEDROCK_RERANK_MODEL: "cohere.rerank-v3-5:0"
          BEDROCK_RERANK_REGION: "us-west-2"
          # Deployed-revision stamp for recorded turns; the timestamped code
          # key already uniquely names each deployed artifact.
          LIBRARIAN_SOURCE_REVISION: !Ref NativeBuildId
          LIBRARIAN_CORPUS_VERSIONS: !Ref NativeCorpusVersions
          # Guest chat lane (2026-09): per-visitor taste + global fail-closed
          # circuit breaker. THINGY_GUEST_CHAT=off is the kill switch.
          THINGY_GUEST_CHAT: "on"
          GUEST_DAILY_QUOTA: "3"
          GUEST_GLOBAL_DAILY_QUOTA: "25"
          LIBRARIAN_NATIVE_HTTP: '1'

  NativeArchiveLiveEndpoint:
    Type: AWS::Lambda::WebFunctionEndpoint
    Condition: NativeWebActive
    DependsOn: NativeArchiveFunction
    Properties:
      FunctionName: !Sub '${AWS::StackName}-web-archive'
      EndpointName: live
      EndpointType: HomeRegion
      AuthType: IamAuth
      RevisionWeights:
        - RevisionId: !If [HasNativeArchiveLiveRevision, !Ref NativeArchiveLiveRevision, !GetAtt NativeArchiveRevision.RevisionId]
          Weight: 100
      ScalingConfig: { MaxEnvironments: 5 }
      ThrottleConfig: { RateLimit: 100 }

  NativeArchiveRollbackEndpoint:
    Type: AWS::Lambda::WebFunctionEndpoint
    Condition: NativeWebActive
    DependsOn: NativeArchiveFunction
    Properties:
      FunctionName: !Sub '${AWS::StackName}-web-archive'
      EndpointName: rollback
      EndpointType: HomeRegion
      AuthType: IamAuth
      RevisionWeights:
        - RevisionId: !If [HasNativeArchiveRollbackRevision, !Ref NativeArchiveRollbackRevision, !GetAtt NativeArchiveRevision.RevisionId]
          Weight: 100
      ScalingConfig: { MaxEnvironments: 2 }
      ThrottleConfig: { RateLimit: 0 }

  NativeAuthCandidateEndpoint:
    Type: AWS::Lambda::WebFunctionEndpoint
    Condition: NativeWebActive
    DependsOn: NativeAuthFunction
    Properties:
      FunctionName: !Sub '${AWS::StackName}-web-auth'
      EndpointName: candidate
      EndpointType: HomeRegion
      AuthType: IamAuth
      RevisionWeights:
        - RevisionId: !GetAtt NativeAuthRevision.RevisionId
          Weight: 100
      ScalingConfig: { MaxEnvironments: 2 }
      ThrottleConfig: { RateLimit: 100 }

  NativeArchiveCandidateEndpoint:
    Type: AWS::Lambda::WebFunctionEndpoint
    Condition: NativeWebActive
    DependsOn: NativeArchiveFunction
    Properties:
      FunctionName: !Sub '${AWS::StackName}-web-archive'
      EndpointName: candidate
      EndpointType: HomeRegion
      AuthType: IamAuth
      RevisionWeights:
        - RevisionId: !GetAtt NativeArchiveRevision.RevisionId
          Weight: 100
      ScalingConfig: { MaxEnvironments: 2 }
      ThrottleConfig: { RateLimit: 100 }

  LibrarianDigestFunction:
    Type: AWS::Lambda::Function
    Properties:
      Architectures: [arm64]
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey }
      Environment:
        Variables:
          TABLE_NAME: !Ref LibrarianTable
          LIBRARIAN_RUNTIME_SECRET_ID: weekly-thing-librarian-runtime
          LOG_LEVEL: !Ref LogLevel
          THINGY_MAGIC_LINK_FROM_EMAIL: !Ref ThingyMagicLinkFromEmail
          # The digest's Turnstile line names each site's mode.
          TURNSTILE_MODE_WEEKLY: !Ref TurnstileModeWeekly
      Handler: digest/handler.handler
      MemorySize: 1024
      ReservedConcurrentExecutions: 1
      Role: !GetAtt LibrarianFunctionRole.Arn
      Runtime: nodejs24.x
      Timeout: 35

  NativeLibrarianSubscribeFailuresMetricFilter:
    Type: AWS::Logs::MetricFilter
    Condition: NativeWebActive
    Properties:
      LogGroupName: !Ref NativeAuthLogs
      FilterPattern: '?"buttondown_subscriber_create_failed" ?"buttondown_lookup_failed" ?"buttondown_subscriber_reminder_failed" ?"buttondown_subscriber_resubscribe_failed" ?"subscribe_ledger_write_failed" ?"subscribe_digest_blocked_list_failed"'
      MetricTransformations:
        - MetricName: LibrarianSubscribeFailures
          MetricNamespace: WeeklyThingLibrarian
          MetricValue: "1"

  NativeLibrarianStreamFailuresMetricFilter:
    Type: AWS::Logs::MetricFilter
    Condition: NativeWebActive
    Properties:
      LogGroupName: !Ref NativeArchiveLogs
      FilterPattern: '?"request_failed" ?"retrieve_failed"'
      MetricTransformations:
        - MetricName: LibrarianStreamHandledFailures
          MetricNamespace: WeeklyThingLibrarian
          MetricValue: "1"

  NativeLibrarianGuestBreakerMetricFilter:
    Type: AWS::Logs::MetricFilter
    Condition: NativeWebActive
    Properties:
      LogGroupName: !Ref NativeArchiveLogs
      FilterPattern: '"guest_global_quota_exhausted"'
      MetricTransformations:
        - MetricName: LibrarianGuestBreakerTrips
          MetricNamespace: WeeklyThingLibrarian
          MetricValue: "1"

  NativeLibrarianToolFailuresMetricFilter:
    Type: AWS::Logs::MetricFilter
    Condition: NativeWebActive
    Properties:
      LogGroupName: !Ref NativeArchiveLogs
      FilterPattern: '"tool_call_failed"'
      MetricTransformations:
        - MetricName: LibrarianToolFailures
          MetricNamespace: WeeklyThingLibrarian
          MetricValue: "1"

  NativeLibrarianButtondownFailuresMetricFilter:
    Type: AWS::Logs::MetricFilter
    Condition: NativeWebActive
    Properties:
      LogGroupName: !Ref NativeAuthLogs
      FilterPattern: '?"buttondown_lookup_failed" ?"buttondown_subscriber_create_failed" ?"auth_refresh_reverify_failed" ?"oauth_authorize_buttondown_lookup_failed"'
      MetricTransformations:
        - MetricName: LibrarianButtondownFailures
          MetricNamespace: WeeklyThingLibrarian
          MetricValue: "1"

  NativeExternalOriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: librarian-native-external
        OriginAccessControlOriginType: lambda
        SigningBehavior: always-amz-auth
        SigningProtocol: sigv4
  NativeExternalCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: librarian-native-external
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 1
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: false
          EnableAcceptEncodingBrotli: false
          HeadersConfig: { HeaderBehavior: whitelist, Headers: [Authorization] }
          CookiesConfig: { CookieBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }
  # The auth origin's behaviors (the default and /authorize) compress at the
  # edge: CloudFront compresses only when the cache policy normalizes
  # Accept-Encoding. The archive behaviors keep the policy above with
  # compression off, so /chat's SSE is never buffered for compression.
  NativeCompressedCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: librarian-native-compressed
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 1
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig: { HeaderBehavior: whitelist, Headers: [Authorization] }
          CookiesConfig: { CookieBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }
  # User-Agent reaches the origin (health probes are told apart by it) but
  # stays out of every cache policy, so it never fragments a cache key.
  NativeExternalRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: librarian-native-external
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers: [Origin, Content-Type, Accept, User-Agent, CloudFront-Viewer-Address, X-Librarian-Contract-Version, MCP-Protocol-Version, Mcp-Session-Id, Last-Event-ID]
        CookiesConfig: { CookieBehavior: none }
        QueryStringsConfig: { QueryStringBehavior: all }
  # The /authorize behavior alone: the external policy plus the one cookie the
  # sign-in page reads (the remembered, verified email). Forwarding a cookie is
  # also what lets the consent response's Set-Cookie reach the browser.
  NativeAuthorizeRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: librarian-native-authorize
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers: [Origin, Content-Type, Accept, User-Agent, CloudFront-Viewer-Address, X-Librarian-Contract-Version, MCP-Protocol-Version, Mcp-Session-Id, Last-Event-ID]
        CookiesConfig: { CookieBehavior: whitelist, Cookies: [thingy_email] }
        QueryStringsConfig: { QueryStringBehavior: all }
  NativeOAuthQueryFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: librarian-native-oauth-query
      AutoPublish: true
      FunctionConfig:
        Comment: Normalize OAuth query spaces before native origin signing
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri !== "/authorize") return request;
          var query = [];
          var changed = false;
          Object.keys(request.querystring).forEach(function (key) {
            var field = request.querystring[key];
            var values = field.multiValue || [field];
            var name = key.replace(/\+/g, '%20');
            if (name !== key) changed = true;
            values.forEach(function (entry) {
              var value = entry.value.replace(/\+/g, '%20');
              if (value !== entry.value) changed = true;
              query.push(name + '=' + value);
            });
          });
          if (changed) request.querystring = query.join('&');
          return request;
        }

  # librarian.thingelstad.com, the door MCP clients, WT Builder and Thingy's
  # OAuth use. It was made by hand in 2026-08 and kept by a release script
  # (front-door.mjs) until 2026-11-02, when it, its /mcp headers policy and its
  # access log were imported into this stack unchanged (Jamie: "If you think we
  # should lets make that happen"). Everything is Retain: deleting the stack or
  # turning NativeWebEnabled off leaves the hostname serving. The origin ids
  # keep their pre-native names; renaming one is a normal update.
  # The auth origin's behaviors (the default and /authorize) compress; the
  # archive behaviors never do, so /chat's and /mcp's SSE is never buffered.
  # /authorize alone forwards the thingy_email cookie. /tools is deliberately
  # not routed here, and retired routes (/curiosity-map) have no behavior.
  LibrarianDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: NativeWebActive
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DistributionConfig:
        Comment: Thingy Librarian REST API (API Gateway origin)
        Enabled: true
        Aliases: [librarian.thingelstad.com]
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_100
        # projects-sysadmin's shared web ACL; its rules count only until tuned.
        WebACLId: !ImportValue edge-waf-WebAclArn
        ViewerCertificate:
          AcmCertificateArn: !Sub 'arn:${AWS::Partition}:acm:us-east-1:${AWS::AccountId}:certificate/ccdaa698-257f-4803-bea3-056ddf4896af'
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: LibrarianStreamFunctionUrlOrigin
            DomainName: !GetAtt NativeArchiveLiveEndpoint.DomainName
            OriginAccessControlId: !GetAtt NativeExternalOriginAccess.Id
            ConnectionAttempts: 3
            ConnectionTimeout: 10
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 30
              OriginKeepaliveTimeout: 5
          - Id: LibrarianApiGatewayOrigin
            DomainName: !GetAtt NativeAuthLiveEndpoint.DomainName
            OriginAccessControlId: !GetAtt NativeExternalOriginAccess.Id
            ConnectionAttempts: 3
            ConnectionTimeout: 10
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 35
              OriginKeepaliveTimeout: 5
        DefaultCacheBehavior:
          TargetOriginId: LibrarianApiGatewayOrigin
          ViewerProtocolPolicy: https-only
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: !GetAtt NativeCompressedCachePolicy.Id
          OriginRequestPolicyId: !GetAtt NativeExternalRequestPolicy.Id
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt NativeOAuthQueryFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /authorize
            TargetOriginId: LibrarianApiGatewayOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: !GetAtt NativeCompressedCachePolicy.Id
            OriginRequestPolicyId: !GetAtt NativeAuthorizeRequestPolicy.Id
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt NativeOAuthQueryFunction.FunctionMetadata.FunctionARN
          - PathPattern: /chat
            TargetOriginId: LibrarianStreamFunctionUrlOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: false
            CachePolicyId: !GetAtt NativeExternalCachePolicy.Id
            OriginRequestPolicyId: !GetAtt NativeExternalRequestPolicy.Id
          - PathPattern: /welcome
            TargetOriginId: LibrarianStreamFunctionUrlOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: false
            CachePolicyId: !GetAtt NativeExternalCachePolicy.Id
            OriginRequestPolicyId: !GetAtt NativeExternalRequestPolicy.Id
          - PathPattern: /feedback
            TargetOriginId: LibrarianStreamFunctionUrlOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: false
            CachePolicyId: !GetAtt NativeExternalCachePolicy.Id
            OriginRequestPolicyId: !GetAtt NativeExternalRequestPolicy.Id
          - PathPattern: /retrieve
            TargetOriginId: LibrarianStreamFunctionUrlOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: false
            CachePolicyId: !GetAtt NativeExternalCachePolicy.Id
            OriginRequestPolicyId: !GetAtt NativeExternalRequestPolicy.Id
          - PathPattern: /mcp
            TargetOriginId: LibrarianStreamFunctionUrlOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: false
            CachePolicyId: !GetAtt NativeExternalCachePolicy.Id
            OriginRequestPolicyId: !GetAtt NativeExternalRequestPolicy.Id
            ResponseHeadersPolicyId: !Ref McpChallengeHeaders

  # An MCP client finds the sign-in from the 401's WWW-Authenticate header,
  # which the Lambda origin's own answer does not keep. CloudFront adds it on
  # /mcp; Override false, so a challenge the server does send wins.
  McpChallengeHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ResponseHeadersPolicyConfig:
        Name: librarian-mcp-www-authenticate
        Comment: Restores the static WWW-Authenticate challenge that Lambda Function URLs remap
        CustomHeadersConfig:
          Items:
            - Header: WWW-Authenticate
              Value: Bearer resource_metadata="https://librarian.thingelstad.com/.well-known/oauth-protected-resource"
              Override: false

  # The distribution's access log (Jamie, 2026-10-26; 24 months since
  # 2026-10-28): CloudWatch Logs vended delivery, JSON. The record fields are
  # fixed and never include c-ip, cs-uri-query or cs-uri-stem:
  # GET /share/{token} carries a share token in the path.
  LibrarianAccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /librarian/web-access
      RetentionInDays: 731
  LibrarianAccessLogSource:
    Type: AWS::Logs::DeliverySource
    Condition: NativeWebActive
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: librarian-web-access
      LogType: ACCESS_LOGS
      ResourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${LibrarianDistribution}'
  LibrarianAccessLogDestination:
    Type: AWS::Logs::DeliveryDestination
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: librarian-web-access
      OutputFormat: json
      DestinationResourceArn: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${LibrarianAccessLogGroup}'
  LibrarianAccessLogDelivery:
    Type: AWS::Logs::Delivery
    Condition: NativeWebActive
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DeliverySourceName: !Ref LibrarianAccessLogSource
      DeliveryDestinationArn: !GetAtt LibrarianAccessLogDestination.Arn
      RecordFields:
        - timestamp(ms)
        - cs-method
        - sc-status
        - sc-bytes
        - sc-range-start
        - sc-range-end
        - time-taken
        - time-to-first-byte
        - x-edge-result-type
        - x-edge-detailed-result-type
        - x-edge-location
        - cs-protocol
        - cs(User-Agent)

  LibrarianDigestLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${LibrarianDigestFunction}'
      RetentionInDays: 30
  LibrarianDigestHandledFailuresMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LibrarianDigestLogGroup
      FilterPattern: '"subscribe_digest_blocked_list_failed"'
      MetricTransformations:
        - MetricName: LibrarianSubscribeFailures
          MetricNamespace: WeeklyThingLibrarian
          MetricValue: "1"

Outputs:
  NativeSourceBucketName:
    Value: !Ref NativeSourceBucket
  NativeAuthFunctionName:
    Condition: NativeWebActive
    Value: !Sub '${AWS::StackName}-web-auth'
  NativeAuthCandidateRevision:
    Condition: NativeWebActive
    Value: !GetAtt NativeAuthRevision.RevisionId
  NativeAuthLiveDomain:
    Condition: NativeWebActive
    Value: !GetAtt NativeAuthLiveEndpoint.DomainName
  NativeAuthLiveArn:
    Condition: NativeWebActive
    Value: !GetAtt NativeAuthLiveEndpoint.EndpointArn
  NativeArchiveFunctionName:
    Condition: NativeWebActive
    Value: !Sub '${AWS::StackName}-web-archive'
  NativeArchiveCandidateRevision:
    Condition: NativeWebActive
    Value: !GetAtt NativeArchiveRevision.RevisionId
  NativeArchiveLiveDomain:
    Condition: NativeWebActive
    Value: !GetAtt NativeArchiveLiveEndpoint.DomainName
  NativeArchiveLiveArn:
    Condition: NativeWebActive
    Value: !GetAtt NativeArchiveLiveEndpoint.EndpointArn
  LibrarianApiUrl:
    Description: Base URL for the Archive Librarian API.
    Value: https://librarian.thingelstad.com
  LibrarianStreamUrl:
    Description: Streaming URL for the Archive Librarian chat API.
    Value: https://librarian.thingelstad.com
  BedrockEvalRoleArn:
    Description: IAM role ARN used by on-demand Bedrock Model Evaluation jobs.
    Value: !GetAtt BedrockEvaluationRole.Arn
  LibrarianGoldenRetrieveSecretArn:
    Description: ARN of the generated credential used exclusively by the live retrieval golden harness.
    Value: !Ref LibrarianGoldenRetrieveSecret

  NativeAuthCandidateDomain:
    Condition: NativeWebActive
    Value: !GetAtt NativeAuthCandidateEndpoint.DomainName

  NativeArchiveCandidateDomain:
    Condition: NativeWebActive
    Value: !GetAtt NativeArchiveCandidateEndpoint.DomainName

  NativeExternalOriginAccess:
    Value: !GetAtt NativeExternalOriginAccess.Id

  NativeExternalCachePolicy:
    Value: !GetAtt NativeExternalCachePolicy.Id

  NativeCompressedCachePolicy:
    Value: !GetAtt NativeCompressedCachePolicy.Id
  NativeExternalRequestPolicy:
    Value: !GetAtt NativeExternalRequestPolicy.Id

  NativeAuthorizeRequestPolicy:
    Value: !GetAtt NativeAuthorizeRequestPolicy.Id

  NativeExternalOAuthFunction:
    Value: !GetAtt NativeOAuthQueryFunction.FunctionMetadata.FunctionARN
